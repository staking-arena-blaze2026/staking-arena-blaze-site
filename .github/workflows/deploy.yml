name: Deploy BCH Blaze website

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/deploy.yml
      - .github/scripts/update-site.mjs
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: blaze-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.repository == 'staking-arena-blaze2026/staking-arena-blaze-site'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: website
          ref: main
      - uses: actions/checkout@v4
        with:
          repository: staking-arena-blaze2026/bch-staking-blaze2026
          ref: blaze2026
          path: source
          persist-credentials: false
      - name: Identify source revision
        id: revision
        shell: bash
        run: |
          source_sha=$(git -C source rev-parse HEAD)
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-node@v4
        with:
          node-version-file: source/frontend/.node-version
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            source/frontend/package-lock.json
      - name: Install locked dependencies and build public dual-network frontend
        working-directory: source
        run: |
          npm ci --ignore-scripts
          npm --prefix frontend ci --ignore-scripts
          if [ -d ../website/public-index ]; then
            mkdir -p frontend/public/public-index
            cp -a ../website/public-index/. frontend/public/public-index/
          fi
          INDEX_BUDGET=1500 npx tsx scripts/update-public-index.ts
          npm run blaze:build
      - name: Record compiled website and exact source commit
        env:
          SOURCE_SHA: ${{ steps.revision.outputs.sha }}
        run: |
          node website/.github/scripts/update-site.mjs source/frontend/.pages-production website
          git -C website config user.name 'github-actions[bot]'
          git -C website config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C website add --all
          if ! git -C website diff --cached --quiet; then
            git -C website commit -m "Deploy BCH Blaze source $SOURCE_SHA"
            git -C website push origin HEAD:main
          fi
          echo "Source commit: $SOURCE_SHA" >> "$GITHUB_STEP_SUMMARY"
          echo "Website commit: $(git -C website rev-parse HEAD)" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: source/frontend/.pages-production
      - uses: actions/deploy-pages@v4
        id: deployment
